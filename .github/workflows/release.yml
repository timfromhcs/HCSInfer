# Release pipeline: static Windows EXE(s), Linux/macOS binaries + tar.gz, Python wheels, portable ZIP, checksums, SBOM,
# OSV vulnerability gate, web demo dist.
#
# Trigger: a pushed tag `v*` (creates a DRAFT release; nothing is published automatically) or manual dispatch (build
# and upload artifacts only). Hardware tests (Radeon/Vulkan execution, real models) are NOT part of this workflow:
# they live in hardware.yml and must be run on the self-hosted target machine before the draft is published.
#
# What this workflow proves on a hosted runner: the static-CRT Windows builds link, the EXE imports only system DLLs
# (dumpbin), `--version`/`doctor --json`/`serve` health run from an empty directory with PATH cleared, the Linux binary
# is built inside the manylinux_2_28 image and passes the glibc 2.28 / NEEDED / no-RPATH gate and the portable ctest set,
# the wheels install into fresh venvs and `hcsinfer --version` works. It does NOT prove Vulkan execution, real-model
# inference, a Linux/macOS GPU run or a clean-machine run.
#
# Stages: version-consistency (tag == CMake == pyproject == package.json) -> exe-cpu / exe-vulkan / exe-linux-x86_64 /
# exe-linux-aarch64 / exe-macos-arm64 / web / osv-scan -> bin-win-amd64 (re-publishes the Windows exes as the wheels.yml
# input artifact hcsinfer-bin-win_amd64) -> wheel-plan -> wheels (reusable workflow .github/workflows/wheels.yml, builds
# only the platforms whose binaries exist) -> release.
#
# Platform policy: Windows x64 CPU + Vulkan and Linux x86_64 CPU are REQUIRED for a stable tag. Linux aarch64 and macOS
# arm64 are experimental: they never block a release and the release notes list them as experimental. The Linux x86_64
# Vulkan binary (HCSInfer-vulkan, links libvulkan.so.1) is best effort. For -rc tags every job except Windows CPU is
# non-blocking.
#
# Artifact contract (wheels.yml header): hcsinfer-bin-<plat> holds HCSInfer[.exe] and optionally HCSInfer-vulkan[.exe] at
# the artifact root, nothing else. wheels.yml returns wheel-<plat>, wheel-pure and sdist. Release assets: HCSInfer.exe,
# HCSInfer-vulkan.exe, the Windows portable ZIP, HCSInfer-<ver>-<os>-<arch>.tar.gz, wheels + sdist, web dist, CycloneDX
# SBOM, osv-report.json and SHA256SUMS.txt (LF endings, covers every other asset).
#
# Draft handling: an existing DRAFT for the tag is updated (assets replaced, stale assets removed, notes refreshed);
# a PUBLISHED release for the tag is never touched (the job fails). Pre-release is derived from the version (-rc/-beta/
# -alpha), never hard-coded. Notes come from docs/release-notes-<version>.md; a stable tag is refused while that file still
# contains the "TO BE FILLED BY COORDINATOR" block. Stable tags also require HCSInfer-vulkan.exe, the Linux x86_64 CPU tar.gz
# and a passing OSV gate; for -rc tags those may be missing or failing and are then reported.
#
# Action pins: full commit SHAs, trailing comment = release tag (dependabot, .github/dependabot.yml, proposes bumps).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  # Pinned Vulkan SDK for the Vulkan static build (build-time only; end users never need it).
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  version-consistency:
    name: version consistency (tag, CMake, pyproject, package.json)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert versions agree
        id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/check-version.ps1 -Tag $env:TAG

  exe-cpu:
    name: HCSInfer.exe (CPU, static CRT)
    needs: [version-consistency]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build (windows-msvc-release-static)
        run: .\scripts\build.ps1 -Preset windows-msvc-release-static -Parallel 4
      - name: "Test (no models available - model tests report Skipped = NOT RUN)"
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          ctest --preset windows-msvc-release-static --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Imports must be system DLLs only
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          $out = dumpbin /nologo /dependents build\windows-msvc-release-static\bin\HCSInfer.exe
          $out
          $bad = $out | Where-Object { $_ -match '^\s+(\S+\.dll)\s*$' } | ForEach-Object { $Matches[1] } |
            Where-Object { $_ -match '^(MSVCP|VCRUNTIME|VCOMP|api-ms-win-crt)' -or $_ -ieq 'vulkan-1.dll' }
          if ($bad) { throw "unexpected imports: $bad" }
      - name: Restricted-environment run (empty dir, PATH cleared)
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          .\scripts\restricted-env-check.ps1 -Exe build\windows-msvc-release-static\bin\HCSInfer.exe -OutJson artifacts\restricted-env-cpu.json
          $r = Get-Content artifacts\restricted-env-cpu.json -Raw | ConvertFrom-Json
          if ($r.serve.health_status -ne 200 -or $r.serve.gui_status -ne 200 -or @($r.serve.modules_outside_windows_dir).Count -gt 0) {
            throw 'restricted-environment check failed'
          }
      - name: Package (portable folder + ZIP + SBOM)
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          .\scripts\package.ps1 -Preset windows-msvc-release-static -Zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-cpu
          path: |
            build/windows-msvc-release-static/bin/HCSInfer.exe
            artifacts/package/*.zip
            artifacts/package/*.sha256
            artifacts/restricted-env-cpu.json
          if-no-files-found: error

  exe-vulkan:
    name: HCSInfer-vulkan.exe (CPU + Vulkan, static CRT)
    needs: [version-consistency]
    runs-on: windows-latest
    timeout-minutes: 150
    # Release candidates tolerate a failed Vulkan build (the SDK install is the least-proven step and the hosted
    # runner has no GPU); the artifact is then simply absent and the draft says so. STABLE tags require it: there the
    # failure is not tolerated and the release job additionally refuses to run without the file.
    continue-on-error: ${{ needs.version-consistency.outputs.prerelease == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install the pinned Vulkan SDK (build-time only)
        run: |
          if ($env:VULKAN_SDK -and (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) { "using preinstalled SDK $env:VULKAN_SDK"; exit 0 }
          $v = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          $shaUrl = "https://sdk.lunarg.com/sdk/sha/$v/windows/vulkansdk-windows-X64-$v.exe.txt"
          Invoke-WebRequest $url -OutFile sdk.exe
          $expected = ((Invoke-WebRequest $shaUrl).Content.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash sdk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Vulkan SDK checksum mismatch ($expected vs $actual)" }
          Start-Process -FilePath .\sdk.exe -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait
          $sdk = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "SDK not found at $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build (windows-msvc-release-static-vulkan)
        run: .\scripts\build.ps1 -Preset windows-msvc-release-static-vulkan -Parallel 4
      - name: Imports (system DLLs + the system Vulkan loader only)
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          $out = dumpbin /nologo /dependents build\windows-msvc-release-static-vulkan\bin\HCSInfer.exe
          $out
          $bad = $out | Where-Object { $_ -match '^\s+(\S+\.dll)\s*$' } | ForEach-Object { $Matches[1] } |
            Where-Object { $_ -match '^(MSVCP|VCRUNTIME|VCOMP|api-ms-win-crt)' }
          if ($bad) { throw "unexpected imports: $bad" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-vulkan
          path: build/windows-msvc-release-static-vulkan/bin/HCSInfer.exe
          if-no-files-found: error

  bin-win-amd64:
    name: hcsinfer-bin-win_amd64 (wheel input)
    needs: [version-consistency, exe-cpu, exe-vulkan]
    # exe-vulkan may be missing for release candidates (continue-on-error); the artifact then carries only the CPU exe.
    if: ${{ !cancelled() && needs.exe-cpu.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      built: ${{ steps.done.outputs.built }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: exe-*
          path: staged
      - name: Stage HCSInfer.exe / HCSInfer-vulkan.exe at the artifact root (the wheels.yml contract)
        run: |
          set -euo pipefail
          mkdir -p stage
          cpu="$(find staged/exe-cpu -name HCSInfer.exe | head -1)"
          [ -n "$cpu" ] || { echo "::error::exe-cpu has no HCSInfer.exe"; exit 1; }
          cp "$cpu" stage/HCSInfer.exe
          vk="$(find staged/exe-vulkan -name HCSInfer.exe 2>/dev/null | head -1 || true)"
          if [ -n "$vk" ]; then cp "$vk" stage/HCSInfer-vulkan.exe; else echo "::warning::no HCSInfer-vulkan.exe (exe-vulkan produced no artifact)"; fi
          ls -l stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcsinfer-bin-win_amd64
          path: stage/*
          if-no-files-found: error
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  exe-linux-x86_64:
    name: HCSInfer (Linux x86_64, manylinux_2_28 container)
    needs: [version-consistency]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # Required for STABLE tags (this is the Linux release binary); tolerated for release candidates.
    continue-on-error: ${{ needs.version-consistency.outputs.prerelease == 'true' }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version-consistency.outputs.version }}
      # Build image pinned by tag and digest (glibc 2.28 floor; the digest is what pins it).
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.11.21-1@sha256:55a36963bc0504cdf004011001c1072306402f0b8b83be5a5eba7068f93eec53
    outputs:
      built: ${{ steps.done.outputs.built }}
      vulkan: ${{ steps.vk.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build CPU binary in the manylinux_2_28 container (glibc floor 2.28, static libstdc++)
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/hcs-home \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$MANYLINUX_IMAGE" \
            bash scripts/release-build-posix.sh --kind cpu --bootstrap-manylinux --out stage --info-dir buildinfo --jobs 4
      - name: "Test (portable set: unit, contract, parser, kernel-cpu; model tests report Skipped = NOT RUN)"
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release -L '^(unit|contract|parser|kernel-cpu)$' --output-on-failure --no-tests=error -j 4 | tee buildinfo/ctest-cpu.txt
      - name: Run the CPU binary on the plain Ubuntu host (not the build container)
        run: |
          set -euo pipefail
          ./stage/HCSInfer --version
          ./stage/HCSInfer doctor --json | head -c 400; echo
      - name: Build Vulkan binary (links libvulkan.so.1; best effort, reported as NOT BUILT when it fails)
        id: vk
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/hcs-home -e VULKAN_SDK_VERSION="$VULKAN_SDK_VERSION" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$MANYLINUX_IMAGE" \
            bash scripts/release-build-posix.sh --kind vulkan --bootstrap-manylinux --out stage --info-dir buildinfo --jobs 4
      - name: Package tar.gz
        env:
          VK_OUTCOME: ${{ steps.vk.outcome }}
        run: |
          set -euo pipefail
          scripts/package-posix.sh --bin-dir stage --version "$VERSION" --os linux --arch x86_64 --out pkg
          { echo "### Linux x86_64"; echo "* HCSInfer (CPU): built and tested in the manylinux_2_28 container";
            echo "* HCSInfer-vulkan build: $VK_OUTCOME (loads the system libvulkan.so.1; a real-GPU run is NOT RUN)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcsinfer-bin-manylinux_2_28_x86_64
          path: stage/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-linux-x86_64
          path: pkg/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: buildinfo-linux-x86_64
          path: buildinfo/*
          if-no-files-found: warn
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  exe-linux-aarch64:
    name: HCSInfer (Linux aarch64, manylinux_2_28 container, experimental)
    needs: [version-consistency]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    # Experimental platform: never blocks a release and is always reported as experimental.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version-consistency.outputs.version }}
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_aarch64:2026.11.21-1@sha256:126d9eea9d6b1717f3e17b2b3ac51da04ef159a5f935dac36fe92d621dc8f246
    outputs:
      built: ${{ steps.done.outputs.built }}
      tests: ${{ steps.t.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build CPU binary in the manylinux_2_28 aarch64 container
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/hcs-home \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$MANYLINUX_IMAGE" \
            bash scripts/release-build-posix.sh --kind cpu --bootstrap-manylinux --out stage --info-dir buildinfo --jobs 4
      - name: Test (portable set; a failure is reported, the binary is still uploaded as experimental)
        id: t
        continue-on-error: true
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-aarch64-cpu -L '^(unit|contract|parser|kernel-cpu)$' --output-on-failure --no-tests=error -j 4 | tee buildinfo/ctest-cpu.txt
      - name: Package tar.gz
        env:
          TEST_OUTCOME: ${{ steps.t.outcome }}
        run: |
          set -euo pipefail
          scripts/package-posix.sh --bin-dir stage --version "$VERSION" --os linux --arch aarch64 --out pkg
          { echo "### Linux aarch64 (experimental)"; echo "* HCSInfer (CPU) built; portable tests: $TEST_OUTCOME"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcsinfer-bin-manylinux_2_28_aarch64
          path: stage/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-linux-aarch64
          path: pkg/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: buildinfo-linux-aarch64
          path: buildinfo/*
          if-no-files-found: warn
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  exe-macos-arm64:
    name: HCSInfer (macOS arm64, CPU, Metal off, experimental)
    needs: [version-consistency]
    runs-on: macos-15
    timeout-minutes: 150
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version-consistency.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    outputs:
      built: ${{ steps.done.outputs.built }}
      tests: ${{ steps.t.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Tooling (cmake and ninja come from the runner image; install ninja only when missing)
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja
          cmake --version | head -1
          ninja --version
      - name: Build CPU binary (macos-arm64-release preset, GGML_METAL=OFF)
        run: scripts/release-build-posix.sh --kind cpu --out stage --info-dir buildinfo --jobs 4
      - name: Test (portable set; a failure is reported, the binary is still uploaded as experimental)
        id: t
        continue-on-error: true
        run: |
          set -euo pipefail
          ctest --test-dir build/macos-arm64-release -L '^(unit|contract|parser|kernel-cpu)$' --output-on-failure --no-tests=error -j 4 | tee buildinfo/ctest-cpu.txt
      - name: Package tar.gz
        env:
          TEST_OUTCOME: ${{ steps.t.outcome }}
        run: |
          set -euo pipefail
          scripts/package-posix.sh --bin-dir stage --version "$VERSION" --os macos --arch arm64 --out pkg
          { echo "### macOS arm64 (experimental)"; echo "* HCSInfer (CPU, no Metal) built; portable tests: $TEST_OUTCOME"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcsinfer-bin-macosx_11_0_arm64
          path: stage/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-macos-arm64
          path: pkg/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: buildinfo-macos-arm64
          path: buildinfo/*
          if-no-files-found: warn
      - id: done
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  wheel-plan:
    name: wheel platforms (only those whose binaries were built)
    needs: [bin-win-amd64, exe-linux-x86_64, exe-linux-aarch64, exe-macos-arm64]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      platforms: ${{ steps.p.outputs.platforms }}
    steps:
      - id: p
        env:
          WIN: ${{ needs.bin-win-amd64.outputs.built }}
          LX64: ${{ needs.exe-linux-x86_64.outputs.built }}
          LA64: ${{ needs.exe-linux-aarch64.outputs.built }}
          MAC: ${{ needs.exe-macos-arm64.outputs.built }}
        run: |
          set -euo pipefail
          list=""
          [ "$WIN" = true ] && list="$list win_amd64"
          [ "$LX64" = true ] && list="$list manylinux_2_28_x86_64"
          [ "$LA64" = true ] && list="$list manylinux_2_28_aarch64"
          [ "$MAC" = true ] && list="$list macosx_11_0_arm64"
          list="${list# }"
          [ -n "$list" ] || { echo "::error::no platform binaries were built"; exit 1; }
          echo "platforms=$list" >> "$GITHUB_OUTPUT"
          echo "wheel platforms: $list" >> "$GITHUB_STEP_SUMMARY"

  osv-scan:
    name: SBOM + OSV vulnerability gate
    needs: [version-consistency]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Fails on HIGH/CRITICAL (and unknown-severity) findings that osv-allowlist.json does not justify. For release
    # candidates the result is reported but does not stop the draft; a STABLE tag requires it (release job condition).
    continue-on-error: ${{ needs.version-consistency.outputs.prerelease == 'true' }}
    env:
      OSV_SCANNER_VERSION: "2.7.1"
      # sha256 of osv-scanner_linux_amd64 from the official osv-scanner_SHA256SUMS of that release
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install osv-scanner (official release binary, sha256 pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osv"
          curl -fsSL -o "$RUNNER_TEMP/osv/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv/osv-scanner"
          "$RUNNER_TEMP/osv/osv-scanner" --version
      - name: Generate the CycloneDX SBOM (every component carries a purl)
        run: ./scripts/sbom.ps1 -OutFile artifacts/osv/hcsinfer.cdx.json
      - name: Scan the SBOM and the source tree with osv-scanner
        shell: bash
        run: |
          set -uo pipefail
          osv="$RUNNER_TEMP/osv/osv-scanner"
          # exit 0 = clean, 1 = vulnerabilities found (the gate below decides); anything else is a tool failure.
          "$osv" scan source -S artifacts/osv/hcsinfer.cdx.json --allow-no-lockfiles --format json --output-file artifacts/osv/osv-scanner-sbom.json; rc1=$?
          "$osv" scan source -r . --allow-no-lockfiles --format json --output-file artifacts/osv/osv-scanner-source.json; rc2=$?
          echo "osv-scanner exit codes: sbom=$rc1 source=$rc2"
          for rc in "$rc1" "$rc2"; do
            if [ "$rc" != 0 ] && [ "$rc" != 1 ]; then echo "::error::osv-scanner failed (exit $rc)"; exit 1; fi
          done
      - name: Gate (HIGH, CRITICAL and unknown severity fail unless justified in osv-allowlist.json)
        run: >-
          ./scripts/osv-gate.ps1
          -ScannerResult @('artifacts/osv/osv-scanner-sbom.json', 'artifacts/osv/osv-scanner-source.json')
          -OutFile artifacts/osv/osv-gate.json
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if (Test-Path artifacts/osv/osv-gate.json) {
            $r = Get-Content artifacts/osv/osv-gate.json -Raw | ConvertFrom-Json
            "### OSV gate: $($r.result)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            foreach ($b in @($r.blocking)) { "* BLOCKING $($b.package) $($b.id) [$($b.severity)]" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
            "* waived by osv-allowlist.json: $(@($r.waived).Count)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: osv-report
          path: artifacts/osv/*
          if-no-files-found: warn

  wheels:
    name: Python wheels (reusable workflow)
    needs: [version-consistency, wheel-plan]
    # Consumes the hcsinfer-bin-<plat> artifacts of this run, for the platforms that were built (wheel-plan).
    if: ${{ !cancelled() && needs.wheel-plan.result == 'success' }}
    uses: ./.github/workflows/wheels.yml
    with:
      platforms: ${{ needs.wheel-plan.outputs.platforms }}

  web:
    name: Web demo dist (not deployed)
    needs: [version-consistency]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  release:
    name: Checksums + SBOM + draft release
    needs: [version-consistency, exe-cpu, exe-vulkan, bin-win-amd64, exe-linux-x86_64, exe-linux-aarch64, exe-macos-arm64, wheel-plan, wheels, web, osv-scan]
    # Stable tags need Vulkan, Linux x86_64 and a passing OSV gate too; release candidates may ship without them (the
    # assemble step reports what is missing). Experimental platforms never gate.
    if: >-
      ${{ !cancelled() && needs.exe-cpu.result == 'success' && needs.bin-win-amd64.result == 'success'
      && needs.wheels.result == 'success' && needs.web.result == 'success'
      && (needs.version-consistency.outputs.prerelease == 'true'
      || (needs.exe-vulkan.result == 'success' && needs.exe-linux-x86_64.result == 'success' && needs.osv-scan.result == 'success')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create/update the DRAFT release (only on tags)
    env:
      VERSION: ${{ needs.version-consistency.outputs.version }}
      PRERELEASE: ${{ needs.version-consistency.outputs.prerelease }}
      LINUX_X64: ${{ needs.exe-linux-x86_64.outputs.built }}
      LINUX_X64_VULKAN: ${{ needs.exe-linux-x86_64.outputs.vulkan }}
      LINUX_ARM64: ${{ needs.exe-linux-aarch64.outputs.built }}
      LINUX_ARM64_TESTS: ${{ needs.exe-linux-aarch64.outputs.tests }}
      MACOS_ARM64: ${{ needs.exe-macos-arm64.outputs.built }}
      MACOS_ARM64_TESTS: ${{ needs.exe-macos-arm64.outputs.tests }}
      OSV_RESULT: ${{ needs.osv-scan.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staged
      - name: Release notes must be final for a stable tag
        run: |
          $notes = "docs/release-notes-$($env:VERSION).md"
          if (-not (Test-Path $notes)) { throw "release notes file missing: $notes" }
          if ($env:PRERELEASE -ne 'true' -and (Select-String -Path $notes -Pattern 'TO BE FILLED BY COORDINATOR' -Quiet)) {
            throw "$notes still contains the 'TO BE FILLED BY COORDINATOR' block; fill it from evidence before tagging a stable release"
          }
      - name: Assemble release files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          # Windows executables: the artifact that fed the wheels is the single source (hcsinfer-bin-win_amd64).
          $cpu = 'staged\hcsinfer-bin-win_amd64\HCSInfer.exe'
          if (-not (Test-Path $cpu)) { throw "missing CPU executable: $cpu" }
          Copy-Item $cpu release\HCSInfer.exe
          $vk = 'staged\hcsinfer-bin-win_amd64\HCSInfer-vulkan.exe'
          if (Test-Path $vk) { Copy-Item $vk release\HCSInfer-vulkan.exe }
          elseif ($env:PRERELEASE -eq 'true') { "WARNING: HCSInfer-vulkan.exe is absent from this release candidate" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
          else { throw 'stable release requires HCSInfer-vulkan.exe (exe-vulkan produced no artifact)' }
          Get-ChildItem staged\exe-cpu -Recurse -Include *.zip | Copy-Item -Destination release
          # Linux / macOS tar.gz (pkg-<os>-<arch> artifacts; a platform that did not build simply has no directory).
          $tars = @(Get-ChildItem staged -Directory -Filter 'pkg-*' | ForEach-Object { Get-ChildItem $_.FullName -File -Filter '*.tar.gz' })
          $tars | Copy-Item -Destination release
          if ($env:PRERELEASE -ne 'true' -and -not (Test-Path ("release\HCSInfer-$($env:VERSION)-linux-x86_64.tar.gz"))) {
            throw 'stable release requires the Linux x86_64 CPU archive'
          }
          # Wheels / sdist come from wheels.yml: wheel-<plat>, wheel-pure, sdist.
          $py = @(Get-ChildItem staged -Directory | Where-Object { $_.Name -like 'wheel-*' -or $_.Name -eq 'sdist' } | ForEach-Object { Get-ChildItem $_.FullName -File })
          if ($py.Count -lt 2) { throw 'no wheel/sdist artifacts (wheel-*, sdist) were produced by the wheels workflow' }
          $py | Copy-Item -Destination release
          Compress-Archive -Path staged\web-dist\* -DestinationPath release\hcs-studio-web-dist.zip
          .\scripts\sbom.ps1 -OutFile release\hcsinfer.cdx.json
          # OSV report (present even when the gate failed on a release candidate).
          if (Test-Path staged\osv-report\osv-gate.json) { Copy-Item staged\osv-report\osv-gate.json release\osv-report.json }
          else { "WARNING: no OSV report (osv-scan result: $($env:OSV_RESULT))" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
          # Platform status for the notes / step summary: what exists is listed, nothing is implied.
          $rows = @(
            '### Platform status of this release',
            '| Platform | Built | Status |', '|---|---|---|',
            '| Windows x64 CPU (HCSInfer.exe) | yes | required, tested on the hardware runner by the owner |',
            ('| Windows x64 Vulkan (HCSInfer-vulkan.exe) | {0} | required for stable |' -f $(if (Test-Path release\HCSInfer-vulkan.exe) { 'yes' } else { 'NO' })),
            ('| Linux x86_64 CPU | {0} | required for stable; portable ctest set run in CI |' -f $(if ($env:LINUX_X64 -eq 'true') { 'yes' } else { 'NO' })),
            ('| Linux x86_64 Vulkan (libvulkan.so.1) | {0} | best effort; no real-GPU run |' -f $(if ($env:LINUX_X64_VULKAN -eq 'success') { 'yes' } else { 'NO' })),
            ('| Linux aarch64 CPU | {0} (tests: {1}) | EXPERIMENTAL |' -f $(if ($env:LINUX_ARM64 -eq 'true') { 'yes' } else { 'NO' }), $env:LINUX_ARM64_TESTS),
            ('| macOS arm64 CPU (Metal off) | {0} (tests: {1}) | EXPERIMENTAL |' -f $(if ($env:MACOS_ARM64 -eq 'true') { 'yes' } else { 'NO' }), $env:MACOS_ARM64_TESTS),
            ('| OSV gate | {0} | see osv-report.json |' -f $env:OSV_RESULT)
          )
          $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $rows | ForEach-Object { $_ }
          $lines = Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          # LF line endings so `sha256sum -c` works on Linux/macOS (Set-Content would write CRLF on Windows).
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release\SHA256SUMS.txt'), (($lines -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content release\SHA256SUMS.txt
          # Both Windows executables are mandatory for a stable tag (also enforced by the job condition above).
          if ($env:PRERELEASE -ne 'true') {
            foreach ($n in 'HCSInfer.exe', 'HCSInfer-vulkan.exe') { if (-not (Test-Path "release\$n")) { throw "stable release is missing $n" } }
          }
      - name: Verify SHA256SUMS.txt (sha256sum -c, LF only)
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          if grep -q $'\r' SHA256SUMS.txt; then echo "::error::SHA256SUMS.txt contains CR characters"; exit 1; fi
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" = "$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
      - name: Draft GitHub release (tags only; you publish it manually after the hardware tests)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = "docs/release-notes-$($env:VERSION).md"
          if (-not (Test-Path $notes)) { throw "release notes file missing: $notes" }
          # Explicit file list (no glob is handed to gh).
          $files = @(Get-ChildItem release -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $title = "HCSInfer $($env:TAG)"
          $isPre = ($env:PRERELEASE -eq 'true')

          $existing = @(gh release list --limit 200 --json tagName,isDraft | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:TAG })
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed' }
          if ($existing.Count -gt 0) {
            if (-not $existing[0].isDraft) { throw "release $($env:TAG) is already PUBLISHED; refusing to modify it" }
            "Updating existing draft $($env:TAG)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
            # Remove assets of an earlier run that this run no longer produces.
            $keep = @($files | ForEach-Object { Split-Path $_ -Leaf })
            $assets = (gh release view $env:TAG --json assets | ConvertFrom-Json).assets
            foreach ($a in $assets) {
              if ($keep -notcontains $a.name) {
                gh release delete-asset $env:TAG $a.name --yes
                if ($LASTEXITCODE -ne 0) { throw "could not delete stale asset $($a.name)" }
              }
            }
            gh release edit $env:TAG --title $title --notes-file $notes --draft --prerelease=$($isPre.ToString().ToLowerInvariant())
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
          } else {
            $createArgs = @($env:TAG) + $files + @('--draft', '--title', $title, '--notes-file', $notes)
            if ($isPre) { $createArgs += '--prerelease' }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
