# Release pipeline (wave B): static Windows EXE(s), Python wheels, portable ZIP, checksums, SBOM, web demo dist.
#
# Trigger: a pushed tag `v*` (creates a DRAFT release; nothing is published automatically) or manual dispatch (build
# and upload artifacts only). Hardware tests (Radeon/Vulkan execution, real models) are NOT part of this workflow:
# they live in hardware.yml and must be run on the self-hosted target machine before the draft is published.
#
# What this workflow proves on a hosted runner: the static-CRT builds link, the EXE imports only system DLLs
# (dumpbin), `--version`/`doctor --json`/`serve` health run from an empty directory with PATH cleared, the wheel
# installs into a fresh venv and `hcsinfer --help` works. It does NOT prove Vulkan execution, real-model inference or
# a clean-machine run.
#
# Stages: version-consistency (tag == CMake == pyproject == package.json) -> exe-cpu / exe-vulkan / web ->
# wheels (reusable workflow .github/workflows/wheels.yml, consumes the exe artifacts of this run) -> release.
#
# Draft handling: an existing DRAFT for the tag is updated (assets replaced, stale assets removed, notes refreshed);
# a PUBLISHED release for the tag is never touched (the job fails). Pre-release is derived from the version (-rc/-beta/
# -alpha), never hard-coded. Notes come from docs/release-notes-<version>.md. Stable (non-pre-release) tags require
# BOTH HCSInfer.exe and HCSInfer-vulkan.exe; for -rc tags the Vulkan build may be missing and is then reported.
#
# Action pins: full commit SHAs, trailing comment = release tag (dependabot, .github/dependabot.yml, proposes bumps).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  # Pinned Vulkan SDK for the Vulkan static build (build-time only; end users never need it).
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  version-consistency:
    name: version consistency (tag, CMake, pyproject, package.json)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert versions agree
        id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/check-version.ps1 -Tag $env:TAG

  exe-cpu:
    name: HCSInfer.exe (CPU, static CRT)
    needs: [version-consistency]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build (windows-msvc-release-static)
        run: .\scripts\build.ps1 -Preset windows-msvc-release-static -Parallel 4
      - name: "Test (no models available - model tests report Skipped = NOT RUN)"
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          ctest --preset windows-msvc-release-static --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Imports must be system DLLs only
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          $out = dumpbin /nologo /dependents build\windows-msvc-release-static\bin\HCSInfer.exe
          $out
          $bad = $out | Where-Object { $_ -match '^\s+(\S+\.dll)\s*$' } | ForEach-Object { $Matches[1] } |
            Where-Object { $_ -match '^(MSVCP|VCRUNTIME|VCOMP|api-ms-win-crt)' -or $_ -ieq 'vulkan-1.dll' }
          if ($bad) { throw "unexpected imports: $bad" }
      - name: Restricted-environment run (empty dir, PATH cleared)
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          .\scripts\restricted-env-check.ps1 -Exe build\windows-msvc-release-static\bin\HCSInfer.exe -OutJson artifacts\restricted-env-cpu.json
          $r = Get-Content artifacts\restricted-env-cpu.json -Raw | ConvertFrom-Json
          if ($r.serve.health_status -ne 200 -or $r.serve.gui_status -ne 200 -or @($r.serve.modules_outside_windows_dir).Count -gt 0) {
            throw 'restricted-environment check failed'
          }
      - name: Package (portable folder + ZIP + SBOM)
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          .\scripts\package.ps1 -Preset windows-msvc-release-static -Zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-cpu
          path: |
            build/windows-msvc-release-static/bin/HCSInfer.exe
            artifacts/package/*.zip
            artifacts/package/*.sha256
            artifacts/restricted-env-cpu.json
          if-no-files-found: error

  exe-vulkan:
    name: HCSInfer-vulkan.exe (CPU + Vulkan, static CRT)
    needs: [version-consistency]
    runs-on: windows-latest
    timeout-minutes: 150
    # Release candidates tolerate a failed Vulkan build (the SDK install is the least-proven step and the hosted
    # runner has no GPU); the artifact is then simply absent and the draft says so. STABLE tags require it: there the
    # failure is not tolerated and the release job additionally refuses to run without the file.
    continue-on-error: ${{ needs.version-consistency.outputs.prerelease == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install the pinned Vulkan SDK (build-time only)
        run: |
          if ($env:VULKAN_SDK -and (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe")) { "using preinstalled SDK $env:VULKAN_SDK"; exit 0 }
          $v = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          $shaUrl = "https://sdk.lunarg.com/sdk/sha/$v/windows/vulkansdk-windows-X64-$v.exe.txt"
          Invoke-WebRequest $url -OutFile sdk.exe
          $expected = ((Invoke-WebRequest $shaUrl).Content.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash sdk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Vulkan SDK checksum mismatch ($expected vs $actual)" }
          Start-Process -FilePath .\sdk.exe -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait
          $sdk = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "SDK not found at $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build (windows-msvc-release-static-vulkan)
        run: .\scripts\build.ps1 -Preset windows-msvc-release-static-vulkan -Parallel 4
      - name: Imports (system DLLs + the system Vulkan loader only)
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          $out = dumpbin /nologo /dependents build\windows-msvc-release-static-vulkan\bin\HCSInfer.exe
          $out
          $bad = $out | Where-Object { $_ -match '^\s+(\S+\.dll)\s*$' } | ForEach-Object { $Matches[1] } |
            Where-Object { $_ -match '^(MSVCP|VCRUNTIME|VCOMP|api-ms-win-crt)' }
          if ($bad) { throw "unexpected imports: $bad" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-vulkan
          path: build/windows-msvc-release-static-vulkan/bin/HCSInfer.exe
          if-no-files-found: error

  wheels:
    name: Python wheels (reusable workflow)
    needs: [version-consistency, exe-cpu, exe-vulkan]
    # Consumes the exe-cpu / exe-vulkan artifacts of this run; the Vulkan one is optional for release candidates.
    if: ${{ !cancelled() && needs.exe-cpu.result == 'success' }}
    uses: ./.github/workflows/wheels.yml

  web:
    name: Web demo dist (not deployed)
    needs: [version-consistency]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  release:
    name: Checksums + SBOM + draft release
    needs: [version-consistency, exe-cpu, exe-vulkan, wheels, web]
    # Stable tags need the Vulkan build too; release candidates may ship without it (the assemble step reports it).
    if: >-
      ${{ !cancelled() && needs.exe-cpu.result == 'success' && needs.wheels.result == 'success'
      && needs.web.result == 'success'
      && (needs.version-consistency.outputs.prerelease == 'true' || needs.exe-vulkan.result == 'success') }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write   # create/update the DRAFT release (only on tags)
    env:
      VERSION: ${{ needs.version-consistency.outputs.version }}
      PRERELEASE: ${{ needs.version-consistency.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staged
      - name: Assemble release files
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $cpu = 'staged\exe-cpu\build\windows-msvc-release-static\bin\HCSInfer.exe'
          if (-not (Test-Path $cpu)) { throw "missing CPU executable: $cpu" }
          Copy-Item $cpu release\HCSInfer.exe
          $vk = Get-ChildItem staged\exe-vulkan -Recurse -Filter HCSInfer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vk) { Copy-Item $vk.FullName release\HCSInfer-vulkan.exe }
          elseif ($env:PRERELEASE -eq 'true') { "WARNING: HCSInfer-vulkan.exe is absent from this release candidate" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
          else { throw 'stable release requires HCSInfer-vulkan.exe (exe-vulkan produced no artifact)' }
          Get-ChildItem staged\exe-cpu -Recurse -Include *.zip | Copy-Item -Destination release
          # Wheels/sdist come from the wheels workflow (artifact name python-dist*; platform wheels may be several).
          $py = @(Get-ChildItem staged -Directory -Filter 'python-dist*' | ForEach-Object { Get-ChildItem $_.FullName -File })
          if ($py.Count -lt 1) { throw 'no wheel/sdist artifacts (python-dist*) were produced by the wheels workflow' }
          $py | Copy-Item -Destination release
          Compress-Archive -Path staged\web-dist\* -DestinationPath release\hcs-studio-web-dist.zip
          .\scripts\sbom.ps1 -OutFile release\hcsinfer.cdx.json
          $lines = Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          # LF line endings so `sha256sum -c` works on Linux/macOS (Set-Content would write CRLF on Windows).
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release\SHA256SUMS.txt'), (($lines -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content release\SHA256SUMS.txt
          # Both executables are mandatory for a stable tag (also enforced by the job condition above).
          if ($env:PRERELEASE -ne 'true') {
            foreach ($n in 'HCSInfer.exe', 'HCSInfer-vulkan.exe') { if (-not (Test-Path "release\$n")) { throw "stable release is missing $n" } }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
      - name: Draft GitHub release (tags only; you publish it manually after the hardware tests)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = "docs/release-notes-$($env:VERSION).md"
          if (-not (Test-Path $notes)) { throw "release notes file missing: $notes" }
          # Explicit file list (no glob is handed to gh).
          $files = @(Get-ChildItem release -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $title = "HCSInfer $($env:TAG)"
          $isPre = ($env:PRERELEASE -eq 'true')

          $existing = @(gh release list --limit 200 --json tagName,isDraft | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:TAG })
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed' }
          if ($existing.Count -gt 0) {
            if (-not $existing[0].isDraft) { throw "release $($env:TAG) is already PUBLISHED; refusing to modify it" }
            "Updating existing draft $($env:TAG)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
            # Remove assets of an earlier run that this run no longer produces.
            $keep = @($files | ForEach-Object { Split-Path $_ -Leaf })
            $assets = (gh release view $env:TAG --json assets | ConvertFrom-Json).assets
            foreach ($a in $assets) {
              if ($keep -notcontains $a.name) {
                gh release delete-asset $env:TAG $a.name --yes
                if ($LASTEXITCODE -ne 0) { throw "could not delete stale asset $($a.name)" }
              }
            }
            gh release edit $env:TAG --title $title --notes-file $notes --draft --prerelease=$($isPre.ToString().ToLowerInvariant())
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
          } else {
            $createArgs = @($env:TAG) + $files + @('--draft', '--title', $title, '--notes-file', $notes)
            if ($isPre) { $createArgs += '--prerelease' }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
