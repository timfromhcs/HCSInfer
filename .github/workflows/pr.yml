# PR quick gate (AGENTS.md section 18.3) on GitHub-hosted Windows.
#
# What this proves: the CPU preset configures, builds and passes every test that needs no model; the Release leg
# also produces and verifies the portable package (licences + SBOM + SHA256SUMS) and runs the packaged EXE.
# What it does NOT prove (they are NOT RUN here, see hardware.yml): Vulkan/Radeon 680M execution, real-model
# inference, soak, the feature-flagged Vulkan kernel, and the package on a CLEAN machine (this runner has the
# MSVC redistributable). Tests that need HCS_TEST_GGUF report "Skipped" and must be read as NOT RUN, not PASS.
#
# The matrix includes windows-msvc-release-static, the exact preset release.yml ships as HCSInfer.exe, so a
# static-CRT link or test failure is found on the PR, not after the tag is pushed.
# Hosted TEMP is on C: and the product C:-guard refuses writes there: tests that call guarded code use
# tests/support/temp_dir.hpp safe_temp_base() (build-tree drive). New tests that write through guarded commands must too.
#
# Status: green on `main` (see docs/roadmap/STATUS.md for the run id).
# Actions are pinned to full commit SHAs (the trailing comment is the release tag); dependabot proposes bumps.
name: pr-quick-gate

on:
  pull_request:
  push:
    # ci/** and release/** give a bring-up or release branch hosted verification without a PR.
    branches: [main, 'ci/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: pr-quick-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  version-consistency:
    name: version consistency (CMake / pyproject / package.json)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert versions agree
        run: ./scripts/check-version.ps1

  actionlint:
    name: actionlint (workflow static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Official release binary, verified against the SHA-256 published in actionlint_1.7.12_checksums.txt.
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
      - name: Lint workflows
        shell: bash
        run: ./actionlint -color

  build-test:
    name: build + ctest (${{ matrix.preset }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-release, windows-msvc-debug, windows-msvc-release-static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Tool versions
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          $v = @(
            "cmake: $((cmake --version | Select-Object -First 1))",
            "ninja: $(ninja --version)",
            "git: $(git --version)",
            "cl: $((cl 2>&1 | Select-Object -First 1))",
            "submodules:", (git submodule status)
          )
          $v | Tee-Object artifacts/environment.txt

      - name: Configure + build (${{ matrix.preset }})
        run: .\scripts\build.ps1 -Preset ${{ matrix.preset }} -Parallel 4

      - name: List discovered tests
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          ctest --preset ${{ matrix.preset }} -N | Tee-Object artifacts/ctest-list-${{ matrix.preset }}.txt

      - name: ctest (no models available)
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error 2>&1 |
            Tee-Object artifacts/ctest-${{ matrix.preset }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report skipped (NOT RUN) tests
        if: always()
        run: |
          $f = "artifacts/ctest-${{ matrix.preset }}.txt"
          if (Test-Path $f) {
            $skipped = Select-String -Path $f -Pattern '\(Skipped\)'
            "NOT RUN (skipped, need HCS_TEST_GGUF or a GPU build): $(@($skipped).Count)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-evidence-${{ matrix.preset }}
          path: artifacts/*.txt
          if-no-files-found: warn

      # W6: the portable package, its licences, SBOM and SHA-256 are produced by CI, not only locally.
      - name: Package (Release only)
        if: matrix.preset == 'windows-msvc-release'
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          .\scripts\package.ps1 -Preset windows-msvc-release -Zip *>&1 | Tee-Object artifacts/package.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package (checksums + standalone run)
        if: matrix.preset == 'windows-msvc-release'
        run: |
          $pkg = Get-ChildItem artifacts/package -Directory -Filter 'HCSInfer-*-portable' | Select-Object -First 1
          if (-not $pkg) { throw 'no package directory was produced' }
          $sums = Get-Content (Join-Path $pkg.FullName 'SHA256SUMS.txt')
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9a-f]{64})\s\s(.+)$') { throw "malformed checksum line: $line" }
            $expected = $Matches[1]; $rel = $Matches[2]
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $pkg.FullName $rel)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "checksum mismatch for $rel" }
          }
          if (@($sums).Count -lt 10) { throw "SHA256SUMS covers too few files: $(@($sums).Count)" }
          $sbom = Get-Content (Join-Path $pkg.FullName 'sbom.cdx.json') -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX' -or @($sbom.components).Count -lt 1) { throw 'packaged SBOM malformed' }
          & (Join-Path $pkg.FullName 'HCSInfer.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'the packaged HCSInfer.exe failed to start' }
          "package verified: $(@($sums).Count) files, SBOM $(@($sbom.components).Count) components" |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.preset == 'windows-msvc-release'
        with:
          name: package-${{ matrix.preset }}
          path: |
            artifacts/package/*.zip
            artifacts/package/*.sha256
            artifacts/package/HCSInfer-*-portable/SHA256SUMS.txt
            artifacts/package/HCSInfer-*-portable/sbom.cdx.json
            artifacts/package/HCSInfer-*-portable/manifest.json
          if-no-files-found: error

  format:
    name: clang-format check
    runs-on: windows-latest
    timeout-minutes: 15
    # BLOCKING since 2026-11-17: the job passed on this runner (run 44105659773) with the tree formatted by the
    # Visual-Studio-bundled clang-format 19.1.5 that scripts/format.ps1 now prefers, so local and CI agree. If a
    # future runner image updates its bundled LLVM the job can fail on pure re-wrapping; that is then a real
    # formatter-version change to be handled deliberately, not a flake.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: .\scripts\format.ps1

  web:
    name: web (HCS Studio Web tests)
    runs-on: windows-latest
    timeout-minutes: 15
    # Gates the browser deliverable `web/` (AGENTS.md 26.7, ADR-013). It needs only Node - no compiler,
    # no submodules, no models. `npm test` is the same command `vercel.json` runs as the deploy buildCommand.
    defaults:
      run:
        shell: pwsh
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Unit + static security tests
        run: npm test 2>&1 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      # BLOCKING since 2026-11-17: green on this runner (run 44164109317, 13/13) - the page boots in headless Chrome
      # and the capability probe resolves (it falls back to WASM when there is no WebGPU adapter). Boot needs no
      # network: app.js only imports local modules, and the pinned CDN import happens lazily when a model is loaded.
      # If a future runner image changes Chrome behaviour the step can fail; that is then a real change to handle
      # deliberately, not a flake.
      - name: Headless boot check (page + capability probe)
        run: node tests/e2e/boot.mjs 2>&1 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      # Wave B: the deployable dist (no npm dependency, nothing is deployed) must build and boot too.
      - name: Build dist and boot it
        run: |
          npm run build
          $env:HCS_WEB_ROOT = (Resolve-Path dist).Path
          node tests/e2e/boot.mjs 2>&1 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

  static-analysis:
    name: clang-tidy (static analysis)
    runs-on: windows-latest
    timeout-minutes: 30
    # BLOCKING since 2026-11-17: the gate is clean with the script's documented default check set, both locally
    # (clang-tidy 19.1.5, 42 translation units) and on this runner (clang-tidy 20.1.8 from the LLVM install, 47
    # units) - see docs/static-analysis.md. A finding now fails the job on purpose; the reason for every check that
    # is excluded by default is documented there and in the script.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure (compile database only)
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          cmake --preset windows-msvc-release
      - name: clang-tidy
        run: |
          # *>&1 merges every stream (the script reports with Write-Host) so Tee-Object actually captures the log.
          .\scripts\static-analysis.ps1 -Preset windows-msvc-release -Scope src -Parallel 4 -FailOnFindings *>&1 |
            Tee-Object -FilePath artifacts/clang-tidy.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: clang-tidy
          path: artifacts/clang-tidy.txt
          if-no-files-found: warn

  python:
    name: python package (unit tests, mypy --strict, sdist + wheel, twine check)
    runs-on: windows-latest
    timeout-minutes: 15
    # Wave B. No executable is bundled here, so the "real" tests skip (NOT RUN); release.yml runs them against the
    # freshly built EXE. This job proves the package builds, type-checks and its client logic works.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip build twine pytest mypy
      - name: mypy --strict
        run: |
          python -m pip install -e python
          python -m mypy --config-file python/pyproject.toml python/src python/tests
      - name: pytest
        run: python -m pytest python/tests -q
      - name: Build + twine check
        run: |
          python -m build python --outdir dist
          python -m twine check dist/*

  supply-chain:
    name: SBOM generation + schema sanity
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SBOM
        run: .\scripts\sbom.ps1 -OutFile artifacts\sbom\hcsinfer.cdx.json
      - name: Sanity-check SBOM
        run: |
          $b = Get-Content artifacts\sbom\hcsinfer.cdx.json -Raw | ConvertFrom-Json
          if ($b.bomFormat -ne 'CycloneDX' -or @($b.components).Count -lt 1) { throw 'SBOM malformed' }
          "SBOM components: $(@($b.components).Count)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/hcsinfer.cdx.json

  # ---------------------------------------------------------------------------------------------------------------
  # POSIX legs. Each runs the "portable" ctest set (the test preset's label filter: unit | contract | parser |
  # kernel-cpu); model-dependent tests skip = NOT RUN. Werror stays ON (HCS_WARNINGS_AS_ERRORS default) on HCS targets.
  # ---------------------------------------------------------------------------------------------------------------
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, runner: ubuntu-24.04, preset: linux-gcc-release }
          - { name: linux-clang, runner: ubuntu-24.04, preset: linux-clang-release }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, preset: linux-arm64-release }
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: Tool versions
        run: |
          mkdir -p artifacts
          {
            echo "uname: $(uname -srm)"
            echo "cmake: $(cmake --version | head -1)"
            echo "ninja: $(ninja --version)"
            echo "gcc: $(gcc --version | head -1)"
            echo "clang: $(clang --version 2>&1 | head -1 || true)"
            echo "submodules:"; git submodule status
          } | tee artifacts/environment-${{ matrix.name }}.txt
      - name: Configure (${{ matrix.preset }})
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j4
      - name: List discovered tests
        run: ctest --preset ${{ matrix.preset }} -N | tee artifacts/ctest-list-${{ matrix.name }}.txt
      - name: ctest (portable set, no models available)
        run: |
          set -o pipefail
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error 2>&1 |
            tee artifacts/ctest-${{ matrix.name }}.txt
      - name: Smoke the built binary
        run: |
          exe="$(find build/${{ matrix.preset }} -type f -name HCSInfer | head -1)"
          test -n "$exe"
          "$exe" --version
          "$exe" doctor --json --no-vulkan > artifacts/doctor-${{ matrix.name }}.json
          python3 -c "import json; r=json.load(open('artifacts/doctor-${{ matrix.name }}.json')); print('doctor ok; keys:', sorted(r)[:8])"
      - name: Report skipped (NOT RUN) tests
        if: always()
        run: |
          f="artifacts/ctest-${{ matrix.name }}.txt"
          if [ -f "$f" ]; then
            echo "NOT RUN (skipped, need HCS_TEST_GGUF or a GPU build): $(grep -c '(Skipped)' "$f" || true)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-evidence-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: warn

  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 120
    # continue-on-error until a first hosted run proves it (macOS is best effort in V1.1, see docs/ci.md). A failure
    # here is reported, never counted as PASS.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build tools
        run: brew install ninja ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: ccache-macos-arm64-
      - name: Configure
        run: |
          cmake --preset macos-arm64-release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset macos-arm64-release -j4
      - name: ctest (portable set, no models available)
        run: |
          set -o pipefail
          mkdir -p artifacts
          ctest --preset macos-arm64-release --output-on-failure --no-tests=error 2>&1 | tee artifacts/ctest-macos-arm64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-evidence-macos-arm64
          path: artifacts/*
          if-no-files-found: warn

  linux-vulkan-smoke:
    name: linux-vulkan-smoke (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      VULKAN_SDK_VERSION: "1.4.363.1"
      VULKAN_SDK_SHA256: "b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install build tools + software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers spirv-headers
      # Ubuntu 24.04 glslc/spirv-tools are too old for GL_EXT_integer_dot_product (run 46003458128). Use the LunarG
      # SDK compiler, pinned to an exact version and verified against the SHA-256 LunarG publishes for it; only
      # glslc + spirv-val are kept (build-time tools, never shipped).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vktools
        with:
          path: ~/vk-tools
          key: lunarg-vk-tools-${{ env.VULKAN_SDK_VERSION }}
      - name: Install LunarG glslc + spirv-val (checksum verified)
        if: steps.vktools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o vksdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          echo "${VULKAN_SDK_SHA256}  vksdk.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/vk-tools"
          tar -xJf vksdk.tar.xz --wildcards --transform 's,.*/,,' -C "$HOME/vk-tools" \
            '*/x86_64/bin/glslc' '*/x86_64/bin/spirv-val'
          rm -f vksdk.tar.xz
          ls -l "$HOME/vk-tools"; test -x "$HOME/vk-tools/glslc"; test -x "$HOME/vk-tools/spirv-val"
      - name: Put LunarG tools first on PATH
        run: echo "$HOME/vk-tools" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-vulkan-${{ github.sha }}
          restore-keys: ccache-linux-vulkan-
      - name: Vulkan environment
        run: |
          mkdir -p artifacts
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -1)"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          { echo "icd: $icd"; "$HOME/vk-tools/glslc" --version | head -2; "$HOME/vk-tools/spirv-val" --version | head -1; } | tee artifacts/vulkan-tools.txt
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | tee artifacts/vulkaninfo.txt
      - name: Configure (linux-release-vulkan)
        run: |
          cmake --preset linux-release-vulkan -DVulkan_GLSLC_EXECUTABLE="$HOME/vk-tools/glslc" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset linux-release-vulkan -j4
      - name: ctest (portable set; tests that need a GPU or models skip = NOT RUN)
        run: |
          set -o pipefail
          ctest --preset linux-release-vulkan --output-on-failure --no-tests=error 2>&1 |
            tee artifacts/ctest-linux-vulkan.txt
      - name: doctor --json must enumerate a Vulkan device
        run: |
          exe="$(find build/linux-release-vulkan -type f -name HCSInfer | head -1)"
          test -n "$exe"
          "$exe" doctor --json > artifacts/doctor-vulkan.json
          python3 - <<'PY'
          import json
          r = json.load(open("artifacts/doctor-vulkan.json"))
          v = r["vulkan"]
          devs = v.get("devices", [])
          print("vulkan status:", v.get("status"), "devices:", len(devs))
          for d in devs:
              print(" -", d.get("name"), d.get("api_version"), d.get("device_type"))
          assert isinstance(devs, list) and len(devs) >= 1, "no Vulkan device enumerated: " + json.dumps(v)[:500]
          PY
      - name: Note
        run: |
          echo "lavapipe is a CPU Vulkan implementation: this proves loader + device enumeration + build, NOT Radeon 680M execution and NOT real-model inference (NOT RUN, see hardware.yml)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-evidence-linux-vulkan
          path: artifacts/*
          if-no-files-found: warn
