# PR quick gate (AGENTS.md section 18.3) on GitHub-hosted Windows.
#
# What this proves: the CPU preset configures, builds and passes every test that needs no model; the Release leg
# also produces and verifies the portable package (licences + SBOM + SHA256SUMS) and runs the packaged EXE.
# What it does NOT prove (they are NOT RUN here, see hardware.yml): Vulkan/Radeon 680M execution, real-model
# inference, soak, the feature-flagged Vulkan kernel, and the package on a CLEAN machine (this runner has the
# MSVC redistributable). Tests that need HCS_TEST_GGUF report "Skipped" and must be read as NOT RUN, not PASS.
#
# Status: green on `main` (see docs/roadmap/STATUS.md for the run id).
# Hardening TODO: pin actions/* to full commit SHAs once the repository is hosted and the SHAs can be verified.
name: pr-quick-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quick-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-test:
    name: build + ctest (${{ matrix.preset }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-release, windows-msvc-debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Tool versions
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          $v = @(
            "cmake: $((cmake --version | Select-Object -First 1))",
            "ninja: $(ninja --version)",
            "git: $(git --version)",
            "cl: $((cl 2>&1 | Select-Object -First 1))",
            "submodules:", (git submodule status)
          )
          $v | Tee-Object artifacts/environment.txt

      - name: Configure + build (${{ matrix.preset }})
        run: .\scripts\build.ps1 -Preset ${{ matrix.preset }} -Parallel 4

      - name: List discovered tests
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          ctest --preset ${{ matrix.preset }} -N | Tee-Object artifacts/ctest-list-${{ matrix.preset }}.txt

      - name: ctest (no models available)
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error 2>&1 |
            Tee-Object artifacts/ctest-${{ matrix.preset }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report skipped (NOT RUN) tests
        if: always()
        run: |
          $f = "artifacts/ctest-${{ matrix.preset }}.txt"
          if (Test-Path $f) {
            $skipped = Select-String -Path $f -Pattern '\(Skipped\)'
            "NOT RUN (skipped, need HCS_TEST_GGUF or a GPU build): $(@($skipped).Count)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-${{ matrix.preset }}
          path: artifacts/*.txt
          if-no-files-found: warn

      # W6: the portable package, its licences, SBOM and SHA-256 are produced by CI, not only locally.
      - name: Package (Release only)
        if: matrix.preset == 'windows-msvc-release'
        run: |
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          .\scripts\package.ps1 -Preset windows-msvc-release -Zip *>&1 | Tee-Object artifacts/package.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify package (checksums + standalone run)
        if: matrix.preset == 'windows-msvc-release'
        run: |
          $pkg = Get-ChildItem artifacts/package -Directory -Filter 'HCSInfer-*-portable' | Select-Object -First 1
          if (-not $pkg) { throw 'no package directory was produced' }
          $sums = Get-Content (Join-Path $pkg.FullName 'SHA256SUMS.txt')
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9a-f]{64})\s\s(.+)$') { throw "malformed checksum line: $line" }
            $expected = $Matches[1]; $rel = $Matches[2]
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $pkg.FullName $rel)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "checksum mismatch for $rel" }
          }
          if (@($sums).Count -lt 10) { throw "SHA256SUMS covers too few files: $(@($sums).Count)" }
          $sbom = Get-Content (Join-Path $pkg.FullName 'sbom.cdx.json') -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX' -or @($sbom.components).Count -lt 1) { throw 'packaged SBOM malformed' }
          & (Join-Path $pkg.FullName 'HCSInfer.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'the packaged HCSInfer.exe failed to start' }
          "package verified: $(@($sums).Count) files, SBOM $(@($sbom.components).Count) components" |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'windows-msvc-release'
        with:
          name: package-${{ matrix.preset }}
          path: |
            artifacts/package/*.zip
            artifacts/package/*.sha256
            artifacts/package/HCSInfer-*-portable/SHA256SUMS.txt
            artifacts/package/HCSInfer-*-portable/sbom.cdx.json
            artifacts/package/HCSInfer-*-portable/manifest.json
          if-no-files-found: error

  format:
    name: clang-format check
    runs-on: windows-latest
    timeout-minutes: 15
    # BLOCKING since 2026-11-17: the job passed on this runner (run 44105659773) with the tree formatted by the
    # Visual-Studio-bundled clang-format 19.1.5 that scripts/format.ps1 now prefers, so local and CI agree. If a
    # future runner image updates its bundled LLVM the job can fail on pure re-wrapping; that is then a real
    # formatter-version change to be handled deliberately, not a flake.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check formatting
        run: .\scripts\format.ps1

  web:
    name: web (HCS Studio Web tests)
    runs-on: windows-latest
    timeout-minutes: 15
    # Gates the browser deliverable `web/` (AGENTS.md 26.7, ADR-013). It needs only Node - no compiler,
    # no submodules, no models. `npm test` is the same command `vercel.json` runs as the deploy buildCommand.
    defaults:
      run:
        shell: pwsh
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit + static security tests
        run: npm test 2>&1 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      # BLOCKING since 2026-11-17: green on this runner (run 44164109317, 13/13) - the page boots in headless Chrome
      # and the capability probe resolves (it falls back to WASM when there is no WebGPU adapter). Boot needs no
      # network: app.js only imports local modules, and the pinned CDN import happens lazily when a model is loaded.
      # If a future runner image changes Chrome behaviour the step can fail; that is then a real change to handle
      # deliberately, not a flake.
      - name: Headless boot check (page + capability probe)
        run: node tests/e2e/boot.mjs 2>&1 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

  static-analysis:
    name: clang-tidy (static analysis)
    runs-on: windows-latest
    timeout-minutes: 30
    # BLOCKING since 2026-11-17: the gate is clean with the script's documented default check set, both locally
    # (clang-tidy 19.1.5, 42 translation units) and on this runner (clang-tidy 20.1.8 from the LLVM install, 47
    # units) - see docs/static-analysis.md. A finding now fails the job on purpose; the reason for every check that
    # is excluded by default is documented there and in the script.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure (compile database only)
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          . .\scripts\common.ps1
          Initialize-MsvcEnvironment
          cmake --preset windows-msvc-release
      - name: clang-tidy
        run: |
          # *>&1 merges every stream (the script reports with Write-Host) so Tee-Object actually captures the log.
          .\scripts\static-analysis.ps1 -Preset windows-msvc-release -Scope src -Parallel 4 -FailOnFindings *>&1 |
            Tee-Object -FilePath artifacts/clang-tidy.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clang-tidy
          path: artifacts/clang-tidy.txt
          if-no-files-found: warn

  supply-chain:
    name: SBOM generation + schema sanity
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate SBOM
        run: .\scripts\sbom.ps1 -OutFile artifacts\sbom\hcsinfer.cdx.json
      - name: Sanity-check SBOM
        run: |
          $b = Get-Content artifacts\sbom\hcsinfer.cdx.json -Raw | ConvertFrom-Json
          if ($b.bomFormat -ne 'CycloneDX' -or @($b.components).Count -lt 1) { throw 'SBOM malformed' }
          "SBOM components: $(@($b.components).Count)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom/hcsinfer.cdx.json
